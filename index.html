<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dialogs.css">
  <!-- 模块图逐层 import 发现太慢（冷盘时串行 fetch），HTML 阶段就并行预取全部模块 -->
  <link rel="modulepreload" href="js/config/constants.js">
  <link rel="modulepreload" href="js/lib/animations.js">
  <link rel="modulepreload" href="js/lib/chrome-bookmarks.js">
  <link rel="modulepreload" href="js/lib/chrome-wallpapers.js">
  <link rel="modulepreload" href="js/lib/navigation.js">
  <link rel="modulepreload" href="js/lib/storage.js">
  <link rel="modulepreload" href="js/ui/elements.js">
  <link rel="modulepreload" href="js/lib/dialogs.js">
  <link rel="modulepreload" href="js/lib/search-preference.js">
  <link rel="modulepreload" href="js/ui/search-ui.js">
  <link rel="modulepreload" href="js/ui/settings-ui.js">
  <link rel="modulepreload" href="js/features/bookmarks.js">
  <link rel="modulepreload" href="js/features/profile.js">
  <link rel="modulepreload" href="js/features/search-history-controller.js">
  <link rel="modulepreload" href="js/features/search-history-store.js">
  <link rel="modulepreload" href="js/features/search.js">
  <link rel="modulepreload" href="js/features/settings.js">
  <link rel="modulepreload" href="js/features/theme.js">
  <link rel="modulepreload" href="js/features/wallpaper.js">
</head>
<body class="app-loading">
  <div class="toolbar">
    <button type="button" id="wallpaper-pin-toggle" class="toolbar-btn" aria-label="Pin wallpaper" aria-pressed="false">Pin</button>
    <button type="button" id="settings-toggle" class="toolbar-btn" aria-label="Open settings" aria-expanded="false">Settings</button>
  </div>

  <div id="settings-panel" class="settings-panel" hidden>
    <div class="settings-panel-header">
      <h2>Settings</h2>
      <button type="button" id="settings-close" class="settings-close" aria-label="Close settings">Close</button>
    </div>

    <label class="settings-field" for="search-engine-trigger">Search engine</label>
    <div class="settings-select-wrap">
      <select id="search-engine-select" class="settings-select-native" tabindex="-1" aria-hidden="true">
        <option value="bing">Bing</option>
        <option value="google">Google</option>
        <option value="baidu">Baidu</option>
      </select>
      <button
        type="button"
        id="search-engine-trigger"
        class="settings-select"
        aria-haspopup="listbox"
        aria-expanded="false"
      >Bing</button>
      <div id="search-engine-options" class="settings-select-menu" role="listbox" hidden>
        <button type="button" class="settings-select-option" role="option" data-value="bing">Bing</button>
        <button type="button" class="settings-select-option" role="option" data-value="google">Google</button>
        <button type="button" class="settings-select-option" role="option" data-value="baidu">Baidu</button>
      </div>
    </div>

    <div class="settings-section">
      <label class="settings-field" for="wallpaper-mode-trigger">Wallpaper order</label>
      <div class="settings-select-wrap">
        <select id="wallpaper-mode-select" class="settings-select-native" tabindex="-1" aria-hidden="true">
          <option value="random">Random</option>
          <option value="sequential">Sequential</option>
        </select>
        <button
          type="button"
          id="wallpaper-mode-trigger"
          class="settings-select"
          aria-haspopup="listbox"
          aria-expanded="false"
        >Random</button>
        <div id="wallpaper-mode-options" class="settings-select-menu" role="listbox" hidden>
          <button type="button" class="settings-select-option" role="option" data-value="random">Random</button>
          <button type="button" class="settings-select-option" role="option" data-value="sequential">Sequential</button>
        </div>
      </div>
    </div>

    <div class="settings-section">
      <label class="settings-field" for="display-name-input">Your name</label>
      <input
        type="text"
        id="display-name-input"
        class="settings-input"
        placeholder="Enter your name"
        maxlength="24"
        autocomplete="off"
      >
    </div>

    <div class="settings-section">
      <a
        class="settings-action"
        href="https://haowallpaper.com/"
        target="_blank"
        rel="noopener noreferrer"
      >Find New Wallpapers</a>
    </div>

    <div class="settings-section">
      <button type="button" id="bookmark-add-group" class="settings-action">New bookmark group</button>
    </div>

  </div>

  <div class="main-container">

    <!-- 闂€欒妯″潡 -->
    <div class="greeting-module">
      <h1 id="greeting">浣犲ソ</h1>
    </div>

    <!-- 鎼滅储妯″潡 -->
    <div class="search-module">
      <form id="search-form">
        <span id="search-engine-tag" class="search-engine-tag">Bing</span>
        <input type="text" id="search-input" placeholder="鎼滅储..." autocomplete="off">
        <button type="submit" id="search-btn" aria-label="Search">→</button>
      </form>
      <!-- 鎼滅储鍘嗗彶涓嬫媺妗?-->
      <div id="search-history" class="search-history"></div>
    </div>

    <!-- 蹇嵎涔︾妯″潡 -->
    <div class="bookmark-module">
      <div id="bookmark-list" class="bookmark-list is-loading">
        <div class="bookmark-skeleton" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>
    </div>
  </div>

  <script src="vendor/gsap.min.js"></script>
  <script src="vendor/CustomEase.min.js"></script>
  <script src="vendor/ScrambleTextPlugin.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
